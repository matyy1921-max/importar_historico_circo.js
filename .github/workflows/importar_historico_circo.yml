name: Importar histórico Circo

on:
  workflow_dispatch:
    inputs:
      fecha_desde:
        description: "Fecha desde, formato YYYY-MM-DD"
        required: true
        default: "2026-05-08"

      fecha_hasta:
        description: "Fecha hasta, formato YYYY-MM-DD"
        required: true
        default: "2026-05-10"

jobs:
  importar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Mostrar versiones
        run: |
          node --version
          npm --version

      - name: Instalar dependencias
        run: npm install

      - name: Importar datos de Circo
        env:
          CIRCO_EMAIL: ${{ secrets.CIRCO_EMAIL }}
          CIRCO_PASSWORD: ${{ secrets.CIRCO_PASSWORD }}
          CIRCO_WEBAPP_URL: ${{ secrets.CIRCO_WEBAPP_URL }}
          CIRCO_WEBAPP_SECRET: ${{ secrets.CIRCO_WEBAPP_SECRET }}
          CIRCO_CLIENT_MAP_JSON: ${{ secrets.CIRCO_CLIENT_MAP_JSON }}
          CIRCO_DATE_FROM: ${{ inputs.fecha_desde }}
          CIRCO_DATE_TO: ${{ inputs.fecha_hasta }}
        run: node importar_historico_circo.js
